<!doctype html><meta charset="utf-8"><title>bridge harness</title>
<body style="margin:0;background:#111">
<iframe id="f" style="width:1400px;height:800px;border:0"
        src="/index.html?author=1"></iframe>
<script>
window.LOG = [];
const f = document.getElementById('f');
addEventListener('message', e => {
  if (e.origin !== location.origin) return;
  if (!e.data || e.data.source !== 'bedrock-viewer') return;
  if (e.source !== f.contentWindow) { LOG.push({bad:'wrong source'}); return; }
  LOG.push(e.data);
  if (e.data.type === 'hello') {
    f.contentWindow.postMessage({source:'bedrock-console',type:'hello'}, location.origin);
  }
  if (e.data.type === 'set') {
    // Pretend the write succeeded and hand back the row we would have stored.
    const cam = e.data.state.camera.orbit || e.data.state.camera.free;
    window.SAVED = {ord:e.data.state.ord, what:e.data.what, camera:cam,
                    layers:e.data.state.layers, areas:e.data.state.areas};
    f.contentWindow.postMessage({source:'bedrock-console', type:'saved', ok:true,
      ord:e.data.state.ord,
      what:e.data.what,
      chapter:{camera:cam, layers:e.data.state.layers, areas:e.data.state.areas,
               title:e.data.state.title, dwell_ms:9000}}, location.origin);
  }
});
window.tell = m => f.contentWindow.postMessage(
  Object.assign({source:'bedrock-console'}, m), location.origin);
window.viewerApi = () => f.contentWindow.__api;
window.titles = () => f.contentWindow.__api.titles();
window.clickIn = id => f.contentWindow.document.getElementById(id).click();
window.barHidden = () => f.contentWindow.document.getElementById('authbar').hidden;
</script>
