<head>

<meta name="robots" content="noindex">

<body>

<div id="app">
  <aside id="rail">
    <!-- The mark is a stratigraphic column: four seams of rock, one surfaced

         below 24px, and never without its clearspace. -->
    <div class="brand">
      <svg width="20" height="15" viewBox="0 0 120 90" aria-hidden="true">
        <rect x="0"  y="0"  width="96"  height="18" rx="2" fill="#0088b0"/>
        <rect x="0"  y="24" width="120" height="18" rx="2" fill="#14171a"/>
        <rect x="16" y="48" width="88"  height="18" rx="2" fill="#8d9490"/>
        <rect x="0"  y="72" width="104" height="18" rx="2" fill="#14171a"/>
      </svg>
      <b>Bedrock</b>
    </div>
    <span class="w">Console</span>
    <nav id="nav"></nav>
    <div class="foot">
      <div class="who" id="who"></div>
      <button class="btn sm" id="signout" style="margin-top:10px">Sign out</button>
    </div>
  </aside>
  <main id="view"></main>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal"><div class="inner" id="modalinner"></div></div>
